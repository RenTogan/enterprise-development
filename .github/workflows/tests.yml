name: Build 

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore CarWash.slnx

    - name: Build
      run: dotnet build CarWash.slnx --no-restore

    - name: Test
      run: dotnet test CarWash.Tests/CarWash.Tests.csproj --no-build --verbosity normal